name: ragdemo-phase1
services:
  database:
    image: timescale/timescaledb-ha:pg16@sha256:903669a95321e439a181e2b350d6242a0af2e0ed2629196489780d1e58c46816
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragdemo}
      POSTGRES_USER: ${POSTGRES_USER:-ragdemo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - phase1_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  phase1_data:
