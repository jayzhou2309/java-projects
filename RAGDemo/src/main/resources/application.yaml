spring:
  application:
    name: RAGDemo
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:ragdemo}
    username: ${POSTGRES_USER:ragdemo}
    password: ${POSTGRES_PASSWORD}
  docker:
    compose:
      enabled: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  auth:
    username: ${APP_AUTH_USERNAME:}
    password: ${APP_AUTH_PASSWORD:}
