spring:
  application:
    name: RecommendationsAlgo
  datasource:
    url: jdbc:mysql://localhost:3306/recommedations_project_db?createDatabaseIfNotExist=true
    username: ${db_user}
    password: ${db_password}
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000
  refresh-expiration: 604800000

# Log SQL Generated by Hibernate
logging:
  level:
    org.hibernate.SQL: DEBUG