spring:
  application:
    name: StockRecommendationEngine

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:rag_db}
    username: ${POSTGRES_USER:root}
    password: ${POSTGRES_PASSWORD:root123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    model:
      chat: ${CHAT_MODEL_PROVIDER:none}
      embedding: openai
      audio:
        speech: none
        transcription: none

    openai:
      api-key: ${OPENAI_API_KEY}

      chat:
        timeout: 20s
        max-retries: 0

      embedding:
        model: text-embedding-3-small
        dimensions: 1536


sec:
  user-agent: ${SEC_USER_AGENT}
  tickers-url: https://www.sec.gov/files/company_tickers.json
  submissions-base-url: https://data.sec.gov/submissions
  archives-base-url: https://www.sec.gov/Archives/edgar/data

rag:
  # Nightly SEC index comparison for stored tickers; the recommendation loop runs the same check on demand.
  refresh:
    enabled: ${RAG_REFRESH_ENABLED:true}
    cron: "0 0 7 * * *"
    zone: Asia/Singapore
    quarterly-cadence-days: 100
    recheck-hours: 24
    index-limit: 40
    limits:
      "[10-K]": 1
      "[10-Q]": 1
      "[8-K]": 3
  retrieval:
    default-top-k: 5
    candidate-count: 40
    latest-filings-only: true
    # Requires a FilingReranker adapter before enabling.
    reranking-enabled: false

# Opt-in single-owner integration. The configured account never comes from model arguments.
integration:
  access:
    token: ${INTEGRATION_ACCESS_TOKEN:}

broker:
  ibkr:
    enabled: ${IBKR_ENABLED:false}
    host: ${IBKR_HOST:127.0.0.1}
    port: ${IBKR_PORT:7497}
    client-id: ${IBKR_CLIENT_ID:71}
    account-id: ${IBKR_ACCOUNT_ID:}
    timeout-ms: 10000
    quote-wait-ms: 5000
    # 1 realtime, 2 frozen, 3 delayed, 4 delayed-frozen; TWS may return realtime if entitled.
    market-data-type: ${IBKR_MARKET_DATA_TYPE:4}
    max-positions: 1000

# Deterministic price statistics from broker daily bars. Requires the broker integration.
quant:
  enabled: ${QUANT_ENABLED:false}
  history-days: 120
  refresh-hours: 12
  min-bars: 60
  max-bar-age-days: 5
  atr-period: 14
  volatility-period: 20
  short-sma-period: 20
  long-sma-period: 50
  take-profit-atr-multiple: 2.0
  stop-loss-atr-multiple: 1.0

recommendation:
  enabled: ${RECOMMENDATION_ENABLED:false}
  model: ${RECOMMENDATION_MODEL:}
  max-model-calls: 10
  max-tool-calls: 12
  deadline-ms: ${RECOMMENDATION_DEADLINE_MS:120000}
  # Manager delegations to both specialists run concurrently on a shared pool.
  parallel-specialists: true
  # A ticker with no embedded filings is ingested, and one past its filing cadence refreshed, before RAG research.
  auto-ingest: true
  # Several listings without a request conid: the single listing in this currency is used and disclosed.
  preferred-currency: USD
  max-output-tokens: 1200
  max-observed-tokens: 16000
  max-tool-result-chars: 32000
  max-context-chars: 120000
  max-quote-age-seconds: 120
