spring:
  application:
    name: StockRecommendationEngine

  jackson:
    serialization:
      indent-output: true

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:rag_db}
    username: ${POSTGRES_USER:root}
    password: ${POSTGRES_PASSWORD:root123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    model:
      chat: ${CHAT_MODEL_PROVIDER:none}
      embedding: openai
      audio:
        speech: none
        transcription: none

    openai:
      api-key: ${OPENAI_API_KEY}

      chat:
        timeout: 20s
        max-retries: 0

      embedding:
        model: text-embedding-3-small
        dimensions: 1536


sec:
  user-agent: ${SEC_USER_AGENT}
  tickers-url: https://www.sec.gov/files/company_tickers.json
  submissions-base-url: https://data.sec.gov/submissions
  archives-base-url: https://www.sec.gov/Archives/edgar/data

rag:
  # Nightly SEC index comparison for stored tickers; the recommendation loop runs the same check on demand.
  refresh:
    enabled: ${RAG_REFRESH_ENABLED:true}
    cron: "0 0 7 * * *"
    zone: Asia/Singapore
    quarterly-cadence-days: 100
    recheck-hours: 24
    index-limit: 40
    limits:
      "[10-K]": 1
      "[10-Q]": 1
      "[8-K]": 3
  retrieval:
    default-top-k: 5
    candidate-count: 40
    latest-filings-only: true
    # Whether retrieval reranks by default. Requires a FilingReranker bean (cross-encoder.enabled below) before enabling; a request's
    # "rerank" field (or ?rerank= on evaluate) overrides per call. Off until the cross-encoder is measured (plan 2026-09-13-reranker, Milestone 3).
    reranking-enabled: false
    # The reranker receives the first max(rerank-candidates, topK) of the fused, diversified candidates, so a reranked response is never
    # shorter than the requested topK; 5 to 40.
    rerank-candidates: 20
    # Longest wait for the reranker in milliseconds; on timeout or a reranker exception retrieval keeps the fused order (an Error still
    # propagates); 100 to 60000.
    rerank-timeout-ms: 2000
    # Local cross-encoder reranker (cross-encoder/ms-marco-MiniLM-L-6-v2 on ONNX Runtime, CPU; RAG.md, Cross-encoder reranker).
    # enabled only creates the reranker bean, verifies the files, and loads the model at startup; it does not turn reranking on
    # (reranking-enabled above). The files are not in git: download them into models/ as recorded in
    # documentation/live-runs/2026-09-13-reranker/downloads.md. Relative paths resolve against the working directory (the project root).
    cross-encoder:
      enabled: ${RAG_CROSS_ENCODER_ENABLED:false}
      model-path: models/cross-encoder-ms-marco-MiniLM-L-6-v2/model.onnx
      tokenizer-path: models/cross-encoder-ms-marco-MiniLM-L-6-v2/tokenizer.json
      # Expected SHA-256 of each file; startup fails naming the path on a missing file or a mismatch. The model's first 12 hex characters
      # are recorded as properties.rerankerVersion in evaluation snapshots.
      model-sha256: 5d3e70fd0c9ff14b9b5169a51e957b7a9c74897afd0a35ce4bd318150c1d4d4a
      tokenizer-sha256: d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66
      # Longest (question, chunk) pair in tokens. Question and chunk are each bounded to 20,000 characters, tokenized separately without
      # truncation, and cut longest first in Java (a question is cut only when it and the chunk are both long); the native tokenizer never
      # encodes a pair (RAG.md, Cross-encoder reranker, Input bounds). The model's window is 512; 16 to 512.
      # With enabled true, loading the scorer sets JVM-wide system properties unless already set as an environment variable or -D
      # property: RUST_FLAVOR=cpu (DJL tokenizer native flavor, so no CUDA build is downloaded), OPT_OUT_TRACKING=true and
      # ai.djl.offline=true (DJL's EC2 metadata and telemetry call, which bypasses proxies, returns without connecting; DJL download
      # helpers refuse). Nothing else in this application uses DJL. See RAG.md, Cross-encoder reranker, Network.
      max-length: 512
      # Chunks tokenized and scored together; 1 to 64. Each group runs as one or more ONNX Runtime calls of at most eight 512-token
      # pairs' attention size (rows x longest pair squared), so memory stays bounded at any value (RAG.md, Cross-encoder reranker, Latency).
      batch-size: 20
    # Fuse full-text keyword candidates with the vector candidates (reciprocal rank fusion). On by default since the 2026-09-12
    # measurement (RAG.md, Hybrid Retrieval: snapshots 35 and 34, hit@5 0.600000 to 0.633333, no ticker lower); a request's
    # "hybrid" field overrides per call.
    hybrid-enabled: true
    # Keyword candidates fetched per query when the hybrid path runs; 20 to 200.
    keyword-candidate-count: 40
    # The k in reciprocal rank fusion's 1 / (k + rank); 1 to 1000.
    rrf-k: 60
    # Weight of the vector ranking in reciprocal rank fusion (a chunk at rank r scores weight / (k + r)); 0 to 10.
    rrf-vector-weight: 1.0
    # Weight of the keyword ranking in reciprocal rank fusion; 0 to 10. 0.5 since the 2026-09-12 fusion tuning (RAG.md, Fusion
    # tuning: snapshot 51 keeps hit@5 0.633333, lifts MRR 0.436667 to 0.463373, and brings msft-04 back into the top 5).
    rrf-keyword-weight: 0.5
    # Weight of the figure ranking (chunks holding every number in the query); 0 to 10, 0 leaves the leg off. 1.0 since 2026-09-12
    # (fusion-tuning snapshot 51, where set v1 never ran the leg); kept on 2026-09-13 after measuring it on set v2 (RAG.md, Set v2
    # baseline and figure-leg measurement): snapshot 69 hit@5 0.785714 MRR 0.655187 beats fig 0.0 (71: 0.738095 / 0.533362), 0.5, 1.5, 2.0.
    rrf-figure-weight: 1.0
  evaluation:
    # Classpath resource of the evaluation set to run (recorded as properties.set in every snapshot). v2 is the default;
    # evaluation/retrieval-set-v1.json stays bundled for comparison. Metrics are only comparable within one set.
    set: evaluation/retrieval-set-v2.json
    # Chunks retrieved per question when the evaluation set is run (POST /api/rag/evaluate); 5 to 20.
    window: 10
    # hit@5 floor asserted by the opt-in RetrievalEvaluationLiveTests (-Drag.evaluation.live=true): the current baseline's hit@5
    # minus 0.1, rounded down to a multiple of 0.05. Derived on set v2 (2026-09-13): the v2 winner, snapshot 69 (current weights),
    # has hit@5 0.785714 -> 0.685714 -> 0.65. This supersedes the set v1 floor of 0.50 (v1 baseline 0.6 / snapshot 34 0.633333);
    # v1 and v2 numbers are not comparable. The rise does not tighten protection for the 30 carried v1 questions: 0.65 needs 28 of 42
    # hits, so with the 12 figure-literal questions hitting only 16 of 30 carried must hit (about 0.53, like v1's 0.50); min-non-figure-hit-at-5 below separately requires 18 of those 30. Override with -Drag.evaluation.min-hit-at-5=<fraction>.
    min-hit-at-5: 0.65
    # Second hit@5 floor, over the non-figure slice only: questions whose text has no figure by FilingRetrievalRepository.figureTerms
    # (the rule that decides whether retrieval's figure leg runs); asserted by the same live test after the aggregate floor. Same rule,
    # BigDecimal arithmetic, derived on set v2 snapshot 91 (2026-09-13, current defaults, reproduces snapshot 69 question by question):
    # non-figure hit@5 0.700000 (21 of 30) -> 0.60 -> 0.60. It needs 18 of the 30 non-figure questions to hit at 5, so at most 3 of
    # today's 21 non-figure hits can be lost (the aggregate floor alone allows 5). It is a regression guard on those 30 questions, not a
    # quality improvement. No figure-slice floor: 12 questions, one miss moves it by 0.083. A set with no non-figure questions fails the
    # live test. 0 to 1; override with -Drag.evaluation.min-non-figure-hit-at-5=<fraction>.
    min-non-figure-hit-at-5: 0.60

# Opt-in single-owner integration. The configured account never comes from model arguments.
integration:
  access:
    token: ${INTEGRATION_ACCESS_TOKEN:}

broker:
  ibkr:
    enabled: ${IBKR_ENABLED:false}
    host: ${IBKR_HOST:127.0.0.1}
    port: ${IBKR_PORT:7497}
    client-id: ${IBKR_CLIENT_ID:71}
    account-id: ${IBKR_ACCOUNT_ID:}
    timeout-ms: 10000
    quote-wait-ms: 5000
    # 1 realtime, 2 frozen, 3 delayed, 4 delayed-frozen; TWS may return realtime if entitled.
    market-data-type: ${IBKR_MARKET_DATA_TYPE:4}
    max-positions: 1000

# Deterministic price statistics from broker daily bars. Requires the broker integration.
quant:
  enabled: ${QUANT_ENABLED:false}
  history-days: 120
  refresh-hours: 12
  min-bars: 60
  max-bar-age-days: 5
  atr-period: 14
  volatility-period: 20
  short-sma-period: 20
  long-sma-period: 50
  take-profit-atr-multiple: 2.0
  stop-loss-atr-multiple: 1.0

# Nightly scoring of stored recommendations against stored daily bars (after the filing refresh).
outcomes:
  enabled: ${OUTCOMES_ENABLED:false}
  cron: "0 30 7 * * *"
  zone: Asia/Singapore
  horizons: 5,20,60
  benchmark-conid: ${OUTCOMES_BENCHMARK_CONID:756733}
  history-days: 250
  refresh-hours: 12
  max-runs-per-evaluation: 500
  # Confidence calibration from scored directional runs at the reference horizon (20 days), snapshotted after each pass.
  calibration:
    bins: 5
    min-samples: 30
    prior-weight: 10

recommendation:
  enabled: ${RECOMMENDATION_ENABLED:false}
  model: ${RECOMMENDATION_MODEL:}
  # A full run with both specialists, one critic review, one revision, and a re-review uses about eleven calls.
  max-model-calls: 14
  max-tool-calls: 12
  deadline-ms: ${RECOMMENDATION_DEADLINE_MS:120000}
  # Manager delegations to both specialists run concurrently on a shared pool.
  parallel-specialists: true
  # A ticker with no embedded filings is ingested, and one past its filing cadence refreshed, before RAG research.
  auto-ingest: true
  # Several listings without a request conid: the single listing in this currency is used and disclosed.
  preferred-currency: USD
  # Prior stored runs for the ticker (with outcomes when scored) shown to the manager; 0 disables. Requires outcomes.enabled.
  track-record-runs: 10
  # Critic reviews of the manager's answer against the run's own evidence; the manager revises while another
  # review remains, so the final verdict always describes the answer returned. 0 disables the critic.
  critic-rounds: 2
  max-output-tokens: 1200
  # Cumulative reported usage across manager, specialists, critic, and revision; a full critic cycle re-reads the context.
  max-observed-tokens: 40000
  max-tool-result-chars: 32000
  max-context-chars: 120000
  max-quote-age-seconds: 120
  # Passages per searchFilings call and the longest passage text any model sees; both are the main token levers.
  # Stored evidence, citations, and the response's sources always keep the full text. See application-lean.yaml.
  search-top-k: 5
  model-passage-chars: 4000
  # One retry after this wait when the provider returns a rate limit (HTTP 429); other provider failures stop the run.
  rate-limit-retry-ms: 5000
  # Scheduled watchlist: directional runs during US regular hours so outcomes and calibration data accumulate unattended.
  # Requires recommendation.enabled; the broker and quant should be on for the runs to be scorable.
  schedule:
    enabled: ${WATCHLIST_ENABLED:false}
    tickers: ${WATCHLIST_TICKERS:AAPL,MSFT,NVDA}
    cron: "0 45 10 * * MON-FRI"
    zone: America/New_York
    # A run with the critic can use most of a 30,000 tokens-per-minute allowance; keep consecutive runs in separate minutes.
    pause-ms: 60000
    include-portfolio: false
