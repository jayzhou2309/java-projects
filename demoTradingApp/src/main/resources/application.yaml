spring:
  application:
    name: demoTradingApp
  datasource:
    url: jdbc:mysql://localhost:3306/tradingDB
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Log SQL Generated by Hibernate
logging:
  level:
    org.hibernate.SQL: DEBUG
